ner": "#99efe5", "inverse-on-surface": "#f2f1ee", "on-surface-variant": "#404847", "surface-container-high": "#e9e8e5", "inverse-primary": "#9ad1cb" }, "borderRadius": { "DEFAULT": "1rem", "lg": "2rem", "xl": "3rem", "full": "9999px" }, "spacing": { "touch-target-min": "3rem", "unit-md": "1rem", "unit-lg": "1.25rem", "unit-sm": "0.75rem", "unit-xs": "0.5rem", "screen-margin-tablet": "1.5rem", "unit-xl": "1.5rem", "unit-3xl": "3rem", "screen-margin-mobile": "1rem", "unit-2xs": "0.25rem", "unit-2xl": "2rem" }, "fontFamily": { "body-sm": ["workSans", "Cairo"], "display-lg": ["bricolageGrotesque", "Cairo"], "headline-lg": ["bricolageGrotesque", "Cairo"], "body-md": ["workSans", "Cairo"], "body-lg": ["workSans", "Cairo"], "label-sm": ["workSans", "Cairo"], "display-lg-mobile": ["bricolageGrotesque", "Cairo"], "label-lg": ["workSans", "Cairo"], "headline-sm": ["bricolageGrotesque", "Cairo"], "headline-md": ["bricolageGrotesque", "Cairo"], "label-md": ["workSans", "Cairo"] }, "fontSize": { "body-sm": ["12px", { "lineHeight": "18px", "fontWeight": "400" }], "display-lg": ["34px", { "lineHeight": "44px", "fontWeight": "700" }], "headline-lg": ["24px", { "lineHeight": "34px", "fontWeight": "700" }], "body-md": ["14px", { "lineHeight": "22px", "fontWeight": "400" }], "body-lg": ["16px", { "lineHeight": "26px", "fontWeight": "500" }], "label-sm": ["10px", { "lineHeight": "14px", "fontWeight": "600" }], "display-lg-mobile": ["28px", { "lineHeight": "38px", "fontWeight": "700" }], "label-lg": ["14px", { "lineHeight": "20px", "fontWeight": "600" }], "headline-sm": ["18px", { "lineHeight": "26px", "fontWeight": "600" }], "headline-md": ["20px", { "lineHeight": "30px", "fontWeight": "600" }], "label-md": ["12px", { "lineHeight": "16px", "fontWeight": "600" }] } } } }</script></head><body class="bg-surface text-on-surface flex flex-col min-h-screen pt-safe pb-safe"><main class="flex flex-col relative w-full bg-surface min-h-screen"><div class="flex flex-col w-full pb-8 select-none" dir="rtl">
<!-- Subtle Ambient Glow -->
<div class="absolute -top-24 left-1/2 -translate-x-1/2 w-96 h-96 bg-secondary-fixed/30 rounded-full blur-3xl pointer-events-none -z-10"></div>
<div class="px-screen-margin-mobile flex flex-col items-center text-center mt-2">
<!-- App Logo & Identity -->
<div class="relative group">
<div class="w-24 h-24 rounded-full overflow-hidden shadow-md bg-primary-container p-1 flex items-center justify-center transition-transform active:scale-95 duration-200">
<img alt="شعار تِرميم" class="w-full h-full object-cover rounded-full" src="https://lh3.googleusercontent.com/aida-public/AB6AXuANunYj1XrBtX7XP-y70QcheTrxSFadI85pBuMfeckkcJ1VzJC-k-B56Zk-BA5qDHa08pIAkJ3xX93RKArNM2Wa5c3lyT7ZsquZ5_Ryy-k3K5Kij_K6Jxkm66OlAFpj1gUmwFsbxgPD8DrSDjdjQrLMv9-4i72ncq79Z_dQLz9-DxlwGCfYgDJtMcXVrz3wPpwllRhAgCSWYRyIdaY_8x7Yj8EOZV1TYOQpez4Lg4CRMOeuOgpvxIsV"/>
</div>
<div class="absolute -bottom-1 -inline-end-1 bg-surface-container-lowest text-primary-container p-1 rounded-full shadow-sm flex items-center justify-center">
<span class="material-symbols-outlined text-base">handyman</span>
</div>
</div>
<!-- Title & Peaceful Subtitle -->
<h1 class="font-display-lg-mobile text-display-lg-mobile text-on-surface mt-4 tracking-tight">تِرميم</h1>
<p class="font-body-md text-body-md text-on-surface-variant max-w-xs mt-1 leading-relaxed">
      إدارة بسيطة لأعمال الإصلاح والصيانة لكافة الورش
    </p>
</div>
<!-- Main Login Card -->
<div class="px-screen-margin-mobile mt-6 w-full">
<div class="bg-surface-container-lowest rounded-lg p-5 shadow-sm space-y-4">
<!-- Phone Input Block -->
<div class="space-y-1.5 text-right">
<label class="font-label-md text-label-md text-on-surface-variant block px-1" for="phone-input">
          رقم الهاتف / الجوال
        </label>
<div class="flex items-center gap-2 bg-surface-container-low rounded-DEFAULT px-3 h-14 transition-colors focus-within:bg-surface-container">
<!-- Country Prefix Selector -->
<div class="flex items-center gap-1 text-on-surface font-label-lg text-label-lg pl-2 border-l border-outline-variant/30 select-none">
<span class="text-sm">🇸🇦</span>
<span class="font-semibold text-primary tracking-wide" dir="ltr">+966</span>
</div>
<!-- Number Input -->
<input class="w-full bg-transparent text-right font-headline-sm text-headline-sm text-on-surface placeholder:text-outline/40 focus:outline-none tracking-wider" dir="ltr" id="phone-input" maxlength="11" placeholder="50 123 4567" type="tel"/>
<span class="material-symbols-outlined text-on-surface-variant/60 text-xl">call</span>
</div>
</div>
<!-- PIN Code Quick Indicators -->
<div class="pt-2 text-center space-y-2">
<label class="font-label-md text-label-md text-on-surface-variant block">
          رمز الدخول السريع (PIN)
        </label>
<!-- Tactile PIN dots -->
<div class="flex items-center justify-center gap-3.5 py-1" id="pin-dots">
<div class="w-3.5 h-3.5 rounded-full bg-surface-container-highest transition-all duration-150 pin-dot" data-index="0"></div>
<div class="w-3.5 h-3.5 rounded-full bg-surface-container-highest transition-all duration-150 pin-dot" data-index="1"></div>
<div class="w-3.5 h-3.5 rounded-full bg-surface-container-highest transition-all duration-150 pin-dot" data-index="2"></div>
<div class="w-3.5 h-3.5 rounded-full bg-surface-container-highest transition-all duration-150 pin-dot" data-index="3"></div>
<div class="w-3.5 h-3.5 rounded-full bg-surface-container-highest transition-all duration-150 pin-dot" data-index="4"></div>
<div class="w-3.5 h-3.5 rounded-full bg-surface-container-highest transition-all duration-150 pin-dot" data-index="5"></div>
</div>
</div>
<!-- Workshop Ergonomic Numpad (Designed for single-hand touch) -->
<div class="grid grid-cols-3 gap-2 pt-1 select-none">
<button class="num-key h-13 py-3 rounded-DEFAULT bg-surface-container-low active:bg-surface-container-highest text-on-surface font-headline-md text-headline-md font-bold flex items-center justify-center shadow-xs transition-transform active:scale-95" data-val="1" type="button">١</button>
<button class="num-key h-13 py-3 rounded-DEFAULT bg-surface-container-low active:bg-surface-container-highest text-on-surface font-headline-md text-headline-md font-bold flex items-center justify-center shadow-xs transition-transform active:scale-95" data-val="2" type="button">٢</button>
<button class="num-key h-13 py-3 rounded-DEFAULT bg-surface-container-low active:bg-surface-container-highest text-on-surface font-headline-md text-headline-md font-bold flex items-center justify-center shadow-xs transition-transform active:scale-95" data-val="3" type="button">٣</button>
<button class="num-key h-13 py-3 rounded-DEFAULT bg-surface-container-low active:bg-surface-container-highest text-on-surface font-headline-md text-headline-md font-bold flex items-center justify-center shadow-xs transition-transform active:scale-95" data-val="4" type="button">٤</button>
<button class="num-key h-13 py-3 rounded-DEFAULT bg-surface-container-low active:bg-surface-container-highest text-on-surface font-headline-md text-headline-md font-bold flex items-center justify-center shadow-xs transition-transform active:scale-95" data-val="5" type="button">٥</button>
<button class="num-key h-13 py-3 rounded-DEFAULT bg-surface-container-low active:bg-surface-container-highest text-on-surface font-headline-md text-headline-md font-bold flex items-center justify-center shadow-xs transition-transform active:scale-95" data-val="6" type="button">٦</button>
<button class="num-key h-13 py-3 rounded-DEFAULT bg-surface-container-low active:bg-surface-container-highest text-on-surface font-headline-md text-headline-md font-bold flex items-center justify-center shadow-xs transition-transform active:scale-95" data-val="7" type="button">٧</button>
<button class="num-key h-13 py-3 rounded-DEFAULT bg-surface-container-low active:bg-surface-container-highest text-on-surface font-headline-md text-headline-md font-bold flex items-center justify-center shadow-xs transition-transform active:scale-95" data-val="8" type="button">٨</button>
<button class="num-key h-13 py-3 rounded-DEFAULT bg-surface-container-low active:bg-surface-container-highest text-on-surface font-headline-md text-headline-md font-bold flex items-center justify-center shadow-xs transition-transform active:scale-95" data-val="9" type="button">٩</button>
<button class="h-13 py-3 rounded-DEFAULT bg-surface-container-low text-on-surface-variant font-label-md text-label-md flex items-center justify-center transition-colors active:bg-surface-container-highest" id="btn-clear-all" type="button">مسح</button>
<button class="num-key h-13 py-3 rounded-DEFAULT bg-surface-container-low active:bg-surface-container-highest text-on-surface font-headline-md text-headline-md font-bold flex items-center justify-center shadow-xs transition-transform active:scale-95" data-val="0" type="button">٠</button>
<button class="h-13 py-3 rounded-DEFAULT bg-surface-container-low active:bg-surface-container-highest text-on-surface font-headline-md text-headline-md flex items-center justify-center shadow-xs transition-transform active:scale-95" id="btn-backspace" type="button">
<span class="material-symbols-outlined text-xl">backspace</span>
</button>
</div>
<!-- Primary Action CTA -->
<button class="w-full h-13 py-3.5 bg-primary-container hover:bg-primary text-on-primary rounded-full font-label-lg text-label-lg font-semibold shadow-md flex items-center justify-center gap-2 transition-all duration-150 active:scale-98 mt-2" id="submit-btn" type="button">
<span class="material-symbols-outlined text-xl">login</span>
<span>دخول إلى المحل</span>
</button>
<!-- Recovery Action -->
<div class="text-center pt-1">
<button class="inline-flex items-center gap-1.5 font-label-md text-label-md text-secondary hover:text-primary transition-colors py-1" type="button">
<span class="material-symbols-outlined text-base">sms</span>
<span>نسيت رمز PIN؟ استعادة عبر رسالة SMS</span>
</button>
</div>
</div>
</div>
<!-- Trust & Privacy Affirmation Footer -->
<div class="mt-6 flex items-center justify-center gap-2 px-screen-margin-mobile text-on-surface-variant/80 text-center">
<span class="material-symbols-outlined text-base text-secondary" style="font-variation-settings: 'FILL' 1;">verified_user</span>
<span class="font-body-sm text-body-sm">بيانات ورشتك محفوظة ومحمية تلقائياً</span>
</div>
</div>
<script>
  (function() {
    let pinCode = "";
    const maxDigits = 6;
    const dots = document.querySelectorAll(".pin-dot");
    const submitBtn = document.getElementById("submit-btn");

    function renderDots() {
      dots.forEach((dot, idx) => {
        if (idx < pinCode.length) {
          dot.classList.remove("bg-surface-container-highest");
          dot.classList.add("bg-primary-container", "scale-110");
        } else {
          dot.classList.add("bg-surface-container-highest");
          dot.classList.remove("bg-primary-container", "scale-110");
        }
      });
    }

    document.querySelectorAll(".num-key").forEach(btn => {
      btn.addEventListener("click", () => {
        if (pinCode.length < maxDigits) {
          pinCode += btn.dataset.val;
          renderDots();
        }
      });
    });

    const backBtn = document.getElementById("btn-backspace");
    if (backBtn) {
      backBtn.addEventListener("click", () => {
        if (pinCode.length > 0) {
          pinCode = pinCode.slice(0, -1);
          renderDots();
        }
      });
    }

    const clearBtn = document.getElementById("btn-clear-all");
    if (clearBtn) {
      clearBtn.addEventListener("click", () => {
        pinCode = "";
        renderDots();
      });
    }

    if (submitBtn) {
      submitBtn.addEventListener("click", () => {
        if (pinCode.length < 4) {
          const dotsContainer = document.getElementById("pin-dots");
          dotsContainer.classList.add("animate-pulse");
          setTimeout(() => dotsContainer.classList.remove("animate-pulse"), 400);
        } else {
          submitBtn.innerHTML = '<span class="material-symbols-outlined animate-spin text-xl">progress_activity</span><span>جارٍ التحقق...</span>';
          setTimeout(() => {
            submitBtn.innerHTML = '<span class="material-symbols-outlined text-xl">check_circle</span><span>مرحباً بك!</span>';
          }, 700);
        }
      });
    }
  })();
</script></main></body></html>
